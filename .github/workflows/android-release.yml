name: WeiXuan Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apks:
    name: 构建 Debug 与 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置 JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic

      - name: 配置 Android SDK 工具
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ""
          # 必须为 true：android-actions/setup-android 的 sdkmanager 安装要求先接受许可
          log-accepted-android-sdk-licenses: true

      - name: 安装 Android SDK 平台（compileSdk 37）
        # 2026-10-05 修复：原先用 `--channel=3 platforms;android-37.0` + continue-on-error=true，
        # 预览通道的包名/可用性会被 Google 随时改动 → 安装静默失败 → compileSdk 37 找不到目标
        # → gradlew 编译失败（表现为"连纯文档提交也打红叉"）。现在：先试稳定通道，再退预览通道，
        # 并且**不再吞掉失败**（失败就早失败，且错误可读）。
        run: |
          echo "=== 可用平台（诊断） ==="
          sdkmanager --list 2>/dev/null | grep -E "platforms;android-3[6-9]" || true
          if sdkmanager "platforms;android-37" 2>&1; then
            echo "已安装 platforms;android-37（稳定通道）"
          else
            echo "::warning::稳定通道没有 android-37，回退预览通道 android-37.0"
            sdkmanager --channel=3 "platforms;android-37.0"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: 还原发布证书（未配置 Secrets 时降级为仅构建 Debug）
        id: signing
        env:
          WEIXUAN_RELEASE_KEYSTORE_BASE64: ${{ secrets.WEIXUAN_RELEASE_KEYSTORE_BASE64 }}
          WEIXUAN_RELEASE_STORE_PASSWORD: ${{ secrets.WEIXUAN_RELEASE_STORE_PASSWORD }}
          WEIXUAN_RELEASE_KEY_ALIAS: ${{ secrets.WEIXUAN_RELEASE_KEY_ALIAS }}
          WEIXUAN_RELEASE_KEY_PASSWORD: ${{ secrets.WEIXUAN_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -z "$WEIXUAN_RELEASE_KEYSTORE_BASE64" ||
                -z "$WEIXUAN_RELEASE_STORE_PASSWORD" ||
                -z "$WEIXUAN_RELEASE_KEY_ALIAS" ||
                -z "$WEIXUAN_RELEASE_KEY_PASSWORD" ]]; then
            echo "::warning::未配置 Release 签名 Secrets，本次仅构建 Debug APK（配置后自动恢复双包发布）。"
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$WEIXUAN_RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/weixuan-release.jks"
          echo "has_signing=true" >> "$GITHUB_OUTPUT"

      - name: 构建 Debug 与 Release APK
        env:
          WEIXUAN_RELEASE_STORE_FILE: ${{ runner.temp }}/weixuan-release.jks
          WEIXUAN_RELEASE_STORE_PASSWORD: ${{ secrets.WEIXUAN_RELEASE_STORE_PASSWORD }}
          WEIXUAN_RELEASE_KEY_ALIAS: ${{ secrets.WEIXUAN_RELEASE_KEY_ALIAS }}
          WEIXUAN_RELEASE_KEY_PASSWORD: ${{ secrets.WEIXUAN_RELEASE_KEY_PASSWORD }}
        # 2026-10-05：输出 tee 到文件，失败时把最后 100 行写进 $GITHUB_STEP_SUMMARY ——
        # 这样不用下载需要鉴权的 job 日志，直接读 check-run summary 就能看到真实错误。
        run: |
          set +e
          if [[ "${{ steps.signing.outputs.has_signing }}" == "true" ]]; then
            ./gradlew --no-daemon --no-configuration-cache :app:assembleDebug :app:assembleRelease 2>&1 | tee /tmp/build.log
          else
            ./gradlew --no-daemon --no-configuration-cache :app:assembleDebug 2>&1 | tee /tmp/build.log
          fi
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            {
              echo "## ❌ Gradle 构建失败（退出码 $rc）"
              echo ""
              echo '```'
              tail -100 /tmp/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc

      - name: 验证并整理 APK
        id: apk
        run: |
          debug_apk="app/build/outputs/apk/debug/app-debug.apk"
          release_apk="app/build/outputs/apk/release/app-release.apk"
          output_dir="$RUNNER_TEMP/apks"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          if [[ ! -f "$debug_apk" ]]; then
            echo "::error::未找到 Debug APK。"
            exit 1
          fi
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::未找到 apksigner。"
            exit 1
          fi

          mkdir -p "$output_dir"
          cp "$debug_apk" "$output_dir/app-debug.apk"
          echo "debug_path=$output_dir/app-debug.apk" >> "$GITHUB_OUTPUT"

          # Release 仅在配置了签名 Secrets 时构建与校验
          if [[ -f "$release_apk" ]]; then
            "$apksigner_path" verify "$release_apk"
            cp "$release_apk" "$output_dir/app-release.apk"
            echo "release_path=$output_dir/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "本次未构建 Release APK（未配置签名 Secrets），跳过。"
          fi

      - name: 上传 Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.apk.outputs.debug_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: 上传 Release APK
        if: ${{ steps.apk.outputs.release_path != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.apk.outputs.release_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14
